# Radio Remote – configuration
# Copy to config.yaml and edit.

radio:
  # Shown in the web UI header and browser tab.
  name: "IC-F621"
  # Which hardware this Pi drives:
  #   buttons  an external radio through the Radio Remote HAT (pihat/) or loose optocouplers:
  #            PTT + channel UP/DOWN pressed on the mic lines. Uses gpio: and channel.count/names.
  #   sa818    the SA818S HAT (sa818s-hat/): built-in UHF transceiver, frequencies set over the UART.
  #            Uses the sa818: section and channel.list. See "SA818S HAT" at the end of this file.
  type: buttons

server:
  host: 0.0.0.0
  port: 8080
  # Shared password for operators. CHANGE THIS.
  password: "change-me"
  # Optional TLS (browsers only allow microphone access over HTTPS or localhost).
  # Easiest alternative: `sudo tailscale serve --bg 8080` – see README.
  tls_cert: null
  tls_key: null
  # Where the last known channel is remembered between restarts.
  state_file: state.json

gpio:
  # gpiozero = real Raspberry Pi pins, mock = log only (for development on a laptop)
  backend: gpiozero
  # BCM pin numbers. 17/27/22 default to pull-DOWN at boot, so the radio
  # will not key up while the Pi is booting. Avoid GPIO 0-8 (pulled high at boot).
  ptt_pin: 17
  up_pin: 27
  down_pin: 22
  # true = GPIO high turns the optocoupler LED on (normal wiring in docs/HARDWARE.md)
  active_high: true
  # Optional: input from the radio's busy/squelch-open signal (via opto U4, GPIO23 = pin 16).
  # If null, "busy" is estimated from RX audio level instead.
  busy_pin: null
  # true = enable internal pull-up, input is "busy" when pulled LOW (open-collector/opto)
  busy_pull_up: true
  # true if the radio's signal is the other way round (opto LED is ON when the channel is idle)
  busy_invert: false

channel:
  count: 16            # channels programmed in the radio's zone
  wrap: true           # does UP on the last channel go to channel 1?
  start: 1             # assumed channel on first ever start (use "Sync" in the UI to correct)
  press_ms: 120        # how long each UP/DOWN "button press" is held
  gap_ms: 250          # pause between presses when jumping several channels
  names:
    1: "Ops 1"
    2: "Ops 2"
    3: "Site Repeater"
  # sa818 only: the channel list, with frequencies (MHz). count/names/press_ms/gap_ms are ignored.
  #   freq       receive (and transmit, unless tx_freq is given)
  #   tx_freq    for repeaters
  #   tone       CTCSS in Hz (e.g. 91.5) or DCS (D023N / D023I) on both TX and RX;
  #              rx_tone / tx_tone to set them separately. Leave out for none.
  #   bandwidth, squelch, low_power   override the sa818: defaults for this channel
  list:
    - { name: "Simplex",  freq: 439.1250 }
    - { name: "Repeater", freq: 438.6750, tx_freq: 431.6750, tone: 91.5 }
    - { name: "Low pwr",  freq: 439.2000, low_power: true }

ptt:
  max_tx_seconds: 120  # hard transmit time limit (server-side timeout timer)
  hold_timeout_ms: 1500  # drop PTT if the browser stops sending keepalives (network loss)
  tail_ms: 400         # max time to finish playing buffered audio after PTT release

audio:
  # sounddevice = real sound card, mock = test tone generator (development)
  backend: sounddevice
  # Device name substring (see `python -m sounddevice`) or index. null = system default.
  input_device: null
  output_device: null
  device_rate: 48000   # sound card rate; must be an integer multiple of wire_rate
  wire_rate: 16000     # rate sent over the network
  frame_ms: 20
  rx_gain: 1.0         # radio -> browser
  tx_gain: 1.0         # browser -> radio
  tx_prebuffer_ms: 80  # jitter buffer before TX audio starts playing to the radio
  busy_threshold_dbfs: -45  # RX level considered "signal present" if no busy_pin

selcall:
  # Sequential tone calls (1-20 digits). Type the number in the Selcall panel (or pick a preset),
  # then press P on the desk head or P1 on the handheld to send it. Received calls show on the head.
  enabled: true
  standard: ccir       # ccir (100 ms tones), zvei1 (70 ms) or eea (40 ms)
  # This station's own selcall. Calls to it are highlighted. Write numbers in quotes so
  # leading zeros are kept ("01234"; unquoted 01234 would be read as a different number).
  my_id: null
  tx_delay_ms: 300     # keyed silence before the tones, while the transmitter comes up
  level: 0.3           # tone amplitude 0-1 (audio.tx_gain is applied on top)
  decode: true         # watch received audio for selcalls
  decode_min_digits: 3 # ignore shorter sequences (stops chance matches in speech)
  presets: []
  #  - {name: Base, digits: "12345"}
  #  - {name: All call, digits: "99999"}

webrtc:
  # Audio over WebRTC (Opus over UDP) for the lowest, steadiest latency. Browsers that can't connect
  # fall back to audio over the WebSocket automatically. Control (PTT, channels) always uses the WebSocket.
  enabled: true
  # Not needed on a LAN or Tailscale (direct connection). Over the open internet behind NAT, add a STUN server:
  #   ice_servers: ["stun:stun.l.google.com:19302"]
  ice_servers: []
  rx_jitter_packets: 4   # mic audio buffer on the Pi, in 20 ms packets (2, 4, 8 or 16). Smaller = lower delay
  release_ms: 120        # after PTT release, keep taking audio this long for packets still in flight
  tx_prebuffer_ms: 40    # radio-side buffer while a WebRTC operator transmits (audio.tx_prebuffer_ms is the fallback's)
  tx_max_ms: 200         # if more than this piles up, the oldest audio is dropped to catch up

# ---- SA818S HAT (radio.type: sa818) ---------------------------------------------------------
# On the HAT: PTT = GPIO17 (gpio.ptt_pin, active_high true), busy = the module's AudioON on GPIO23,
# so set gpio.busy_pin: 23 and busy_pull_up: true. gpio.up_pin/down_pin aren't used.
# The Pi 4's main UART is used by Bluetooth: add  dtoverlay=disable-bt  to /boot/firmware/config.txt,
# and turn off the serial console (sudo raspi-config > Interface > Serial: login shell No, hardware Yes).
sa818:
  port: /dev/serial0
  baud: 9600
  pd_pin: 27            # module power-down: high = on (the HAT holds it low until the server starts)
  low_power_pin: 22     # high = 0.5 W, low = 1 W
  band: [400.0, 480.0]  # frequencies outside this are refused (SA818S-U; the V version is 134-174)
  bandwidth: narrow     # narrow (12.5 kHz) or wide (25 kHz)
  squelch: 4            # 0 = open, 1-8
  volume: 6             # module audio output level 1-8 (into the codec)
  low_power: false
  tail_tone: false      # squelch tail elimination tone
  filters:              # the module's own audio filters (false = bypass)
    emphasis: true
    highpass: true
    lowpass: true
  rssi_ms: 500          # how often to read signal strength while receiving
  rssi_offset_db: null  # set to show dBm: dBm = RSSI + offset (calibrate against a known signal)
