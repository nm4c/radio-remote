# RadPi – configuration
# Copy to config.yaml and edit.

radio:
  # Shown in the web UI header and browser tab.
  name: "IC-F621"
  # Which hardware this Pi drives:
  #   buttons  an external radio through the RadPi Control HAT (pihat/) or loose optocouplers:
  #            PTT + channel UP/DOWN pressed on the mic lines. Uses gpio: and channel.count/names.
  #   sa818    the RadPi SA818 HAT (sa818s-hat/): built-in UHF transceiver, frequencies set over the UART.
  #            Uses the sa818: section and channel.list. See "RadPi SA818 HAT" at the end of this file.
  type: buttons

server:
  host: 0.0.0.0
  port: 8080
  # Operators log in with their own accounts, made with `sudo radpi-users add <name>` (see README,
  # "Accounts and security"). Roles: control (everything) or listen (hear only).
  # Upgrading from a version with one shared password? If server.password is still set when the
  # account database is empty, it becomes a control account called "operator". Make personal
  # accounts, then delete the password line.
  # password: "old-shared-password"
  db_file: radio.db        # accounts, "keep me logged in" sessions and the audit log (SQLite)
  session_days: 30         # how long "keep me logged in" lasts after the last use
  audit_days: 365          # audit log retention (0 = keep forever)
  allowed_origins: []      # extra page origins allowed to open the WebSocket; normally none
  # Optional TLS (browsers only allow microphone access over HTTPS or localhost).
  # Easiest alternative: `sudo tailscale serve --bg 8080` – see README.
  tls_cert: null
  tls_key: null
  # Where the last known channel is remembered between restarts.
  state_file: state.json

gpio:
  # gpiozero = real Raspberry Pi pins, mock = log only (for development on a laptop)
  backend: gpiozero
  # BCM pin numbers. 17/27/22 default to pull-DOWN at boot, so the radio
  # will not key up while the Pi is booting. Avoid GPIO 0-8 (pulled high at boot).
  ptt_pin: 17
  up_pin: 27
  down_pin: 22
  # true = GPIO high turns the optocoupler LED on (normal wiring in docs/HARDWARE.md)
  active_high: true
  # Optional: input from the radio's busy/squelch-open signal (via opto U4, GPIO23 = pin 16).
  # If null, "busy" is estimated from RX audio level instead.
  busy_pin: null
  # true = enable internal pull-up, input is "busy" when pulled LOW (open-collector/opto)
  busy_pull_up: true
  # true if the radio's signal is the other way round (opto LED is ON when the channel is idle)
  busy_invert: false

channel:
  count: 16            # channels programmed in the radio's zone
  wrap: true           # does UP on the last channel go to channel 1?
  start: 1             # assumed channel on first ever start (use "Sync" in the UI to correct)
  press_ms: 120        # how long each UP/DOWN "button press" is held
  gap_ms: 250          # pause between presses when jumping several channels
  names:
    1: "Ops 1"
    2: "Ops 2"
    3: "Site Repeater"
  # sa818 only: the channel list, with frequencies (MHz). count/names/press_ms/gap_ms are ignored.
  #   freq       receive (and transmit, unless tx_freq is given)
  #   tx_freq    for repeaters
  #   tone       CTCSS in Hz (e.g. 91.5) or DCS (D023N / D023I) on both TX and RX;
  #              rx_tone / tx_tone to set them separately. Leave out for none.
  #   bandwidth, squelch, low_power   override the sa818: defaults for this channel
  list:
    - { name: "Simplex",  freq: 439.1250 }
    - { name: "Repeater", freq: 438.6750, tx_freq: 431.6750, tone: 91.5 }
    - { name: "Low pwr",  freq: 439.2000, low_power: true }

ptt:
  max_tx_seconds: 120  # hard transmit time limit (server-side timeout timer)
  hold_timeout_ms: 1500  # drop PTT if the browser stops sending keepalives (network loss)
  tail_ms: 400         # max time to finish playing buffered audio after PTT release

audio:
  # sounddevice = real sound card, mock = test tone generator (development)
  backend: sounddevice
  # Device name substring (see `python -m sounddevice`) or index. null = system default.
  input_device: null
  output_device: null
  device_rate: 48000   # sound card rate; must be an integer multiple of wire_rate
  wire_rate: 16000     # rate sent over the network
  frame_ms: 20
  rx_gain: 1.0         # radio -> browser
  tx_gain: 1.0         # browser -> radio
  tx_prebuffer_ms: 80  # jitter buffer before TX audio starts playing to the radio
  # Tone control for transmitted voice and clips (selcall tones are left alone). Phone and laptop
  # mics often sound thin on FM: more bass and a little less treble sounds fuller. 0 = flat.
  # The radio itself passes roughly 300-3000 Hz, so bass below ~300 Hz can't be added.
  # More bass also means more level: recheck deviation after changing it.
  tx_bass_db: 6        # boost below tx_bass_hz (try up to 12 for a lot more)
  tx_bass_hz: 400
  tx_treble_db: -3     # cut above tx_treble_hz (negative = less treble)
  tx_treble_hz: 2500
  busy_threshold_dbfs: -45  # RX level considered "signal present" if no busy_pin

selcall:
  # Sequential tone calls (1-20 digits). Type the number in the Selcall panel (or pick a preset),
  # then press the Call soft key on the radio to send it. Received calls show on the head.
  enabled: true
  standard: ccir       # ccir (100 ms tones), zvei1 (70 ms) or eea (40 ms)
  tone_ms: null        # tone length in ms (30-200); null = the standard's. E.g. 50 for CCIR at 50 ms
  # This station's own selcall. Calls to it are highlighted. Write numbers in quotes so
  # leading zeros are kept ("01234"; unquoted 01234 would be read as a different number).
  my_id: null
  tx_delay_ms: 300     # keyed silence before the tones, while the transmitter comes up
  level: 0.3           # tone amplitude 0-1 (audio.tx_gain is applied on top)
  decode: true         # watch received audio for selcalls
  decode_min_digits: 3 # ignore shorter sequences (stops chance matches in speech)
  presets: []
  #  - {name: Base, digits: "12345"}
  #  - {name: All call, digits: "99999"}

clips:
  # Audio clips: upload them in the Audio clips panel (MP3 or any audio the browser can play),
  # pick one, then press the Play soft key on the radio to transmit it.
  enabled: true
  dir: clips           # where they're kept, relative to this file
  max_seconds: 60      # longest clip; must finish inside ptt.max_tx_seconds
  max_files: 50
  tx_delay_ms: 300     # keyed silence before the clip, while the transmitter comes up
  level: 0.5           # each clip is played with its peak at this level (audio.tx_gain applies on top)

voice_fx:
  # Voice effects for your live voice (not clips or selcalls): Vader, Dalek, Demon, Robot, Giant,
  # Female, Chipmunk, Ghost. Pick one in the Voice effects panel; P (desk) or P1 (handheld)
  # switches it on and off.
  enabled: true

tts:
  # Say: type something in the Say panel, pick a voice, and the Pi speaks it on air (Stop cuts it
  # off). Listen first plays it in your own browser only. Off by default.
  enabled: false
  voices:              # shown in this order; the first is the default. Add speed: 0.5-2 to any voice.
    # Azure AI Speech: natural Australian voices, with a free tier. Needs azure: below.
    - {name: "Natasha (AU female)", backend: azure, voice: en-AU-NatashaNeural}
    - {name: "William (AU male)", backend: azure, voice: en-AU-WilliamNeural}
    # Google Cloud Text-to-Speech. Needs google: below.
    # - {name: "Google AU female", backend: google, voice: en-AU-Neural2-C}
    # - {name: "Google AU male", backend: google, voice: en-AU-Neural2-B}
    # ElevenLabs: any voice from its library (it has Australian ones). Needs elevenlabs: below.
    # - {name: "Bazza", backend: elevenlabs, voice: <voice id>}
    # Offline, on the Pi, with Piper (sudo /opt/radpi/.venv/bin/pip install piper-tts, then download
    # a voice's .onnx and .onnx.json from huggingface.co/rhasspy/piper-voices). Its ready-made voices
    # are British or American; your own Australian one can be trained (docs/voice/README.md).
    # - {name: "Alba (UK female, offline)", backend: piper, voice: voices/en_GB-alba-medium.onnx}
    # - {name: "Alan (UK male, offline)", backend: piper, voice: voices/en_GB-alan-medium.onnx}
  max_chars: 600       # longest text; what's said must also fit in ptt.max_tx_seconds
  level: 0.5           # peak level on air (audio.tx_gain applies on top)
  tx_delay_ms: 300     # keyed silence before speaking, while the transmitter comes up
  pronounce: {RadPi: "Rad Pie"}   # words it says wrong, spelled the way they should sound
  azure: {api_key: null, region: australiaeast}   # the Speech resource's key and region
  google: {api_key: null}
  elevenlabs: {api_key: null, model: null}
  # The AI agent's voice (bot.tts) uses these keys too if it doesn't have its own.

record:
  # The orange button on the radio records received audio into the clip list (see README, Recording).
  enabled: true        # needs clips.enabled
  max_minutes: 15      # each recording is split into parts this long
  keep_mb: 2000        # the oldest recordings are deleted beyond this (about 115 MB an hour)
  min_free_mb: 300     # recording stops if the disk gets this full
  mode: continuous     # default: continuous, or vox (only while the channel is active). The page can pick either.
  include_tx: true     # while we transmit, record what we send (the receiver is muted then)
  vox_hang_ms: 2000    # vox: keep recording this long after the channel goes quiet
  vox_preroll_ms: 500  # vox: and include this much from before it got busy
  vox_gap_ms: 300      # vox: silence between overs
  vox_close_idle_minutes: 10  # vox: after this long quiet, finish the part so it shows in the list

webrtc:
  # Audio over WebRTC (Opus over UDP) for the lowest, steadiest latency. Browsers that can't connect
  # fall back to audio over the WebSocket automatically. Control (PTT, channels) always uses the WebSocket.
  enabled: true
  # Not needed on a LAN or Tailscale (direct connection). Over the open internet behind NAT, add a STUN server:
  #   ice_servers: ["stun:stun.l.google.com:19302"]
  ice_servers: []
  rx_jitter_packets: 4   # mic audio buffer on the Pi, in 20 ms packets (2, 4, 8 or 16). Smaller = lower delay
  release_ms: 120        # after PTT release, keep taking audio this long for packets still in flight
  tx_prebuffer_ms: 40    # radio-side buffer while a WebRTC operator transmits (audio.tx_prebuffer_ms is the fallback's)
  tx_max_ms: 200         # if more than this piles up, the oldest audio is dropped to catch up

# ---- RadPi SA818 HAT (radio.type: sa818) ---------------------------------------------------
# On the HAT: PTT = GPIO17 (gpio.ptt_pin, active_high true), busy = the module's AudioON on GPIO23,
# so set gpio.busy_pin: 23 and busy_pull_up: true. gpio.up_pin/down_pin aren't used.
# The Pi 4's main UART is used by Bluetooth: add  dtoverlay=disable-bt  to /boot/firmware/config.txt,
# and turn off the serial console (sudo raspi-config > Interface > Serial: login shell No, hardware Yes).
sa818:
  port: /dev/serial0
  baud: 9600
  pd_pin: 27            # module power-down: high = on (the HAT holds it low until the server starts)
  low_power_pin: 22     # high = 0.5 W, low = 1 W
  band: [400.0, 480.0]  # frequencies outside this are refused (SA818S-U; the V version is 134-174)
  bandwidth: narrow     # narrow (12.5 kHz) or wide (25 kHz)
  squelch: 4            # 0 = open, 1-8
  volume: 6             # module audio output level 1-8 (into the codec)
  low_power: false
  tail_tone: false      # squelch tail elimination tone
  filters:              # the module's own audio filters (false = bypass)
    emphasis: true
    highpass: true
    lowpass: true
  rssi_ms: 500          # how often to read signal strength while receiving
  rssi_offset_db: null  # set to show dBm: dBm = RSSI + offset (calibrate against a known signal)

# ---- AI agent ------------------------------------------------------------------------------
# Listens to the channel, transcribes every over, learns voices (people you name, and new voices
# under a pseudonym until it learns their name), keeps notes on people, and can answer on air in
# a voice and persona you choose. Off by default: with enabled false nothing of it loads and the
# web page shows no AI panel. Turn it on here, restart, then pick a mode in the AI agent panel:
#   Listen   transcribe and identify only (never transmits)
#   Approve  every reply waits in the panel for an operator to Send or Discard it
#   Auto     replies go on air by themselves when the channel is quiet
# Its packages (over a gigabyte) aren't installed by default: add them with  sudo ./deploy/update.sh --with-ai
# Try it offline first on recordings:  python -m server.bot replay -c config.yaml some-overs/*.wav
# Everything it learns and logs is in bot.dir (see server/bot/agent.py for the log format).
bot:
  enabled: false
  name: "RadPi"            # what it calls itself; saying it on air counts as talking to it
  dir: bot                 # people, notes, logs and over audio
  mode: listen             # at start-up: listen, approve or auto
  persona: null            # built-in: banter (friendly, the default) or cb (foul-mouthed); or your own .md file
  reply_policy: llm        # llm: it decides when to speak; always; addressed: only when named
  wake_words: []           # more names that count as talking to it
  learn_anonymous: true    # remember unfamiliar voices as "Caller N"
  learn_notes: true        # let it note things about people and pick up their names
  tones: true              # it can raise its voice or shout back (faster, higher, mic overdriven)
  opt_out_phrases: []      # e.g. ["forget me"]: deletes that speaker's profile. Empty = off
  context_overs: 12        # recent overs it sees each time
  reply_gap_ms: 1500       # the channel must be quiet this long before it keys up
  reply_wait_s: 20         # gives up on a reply if the channel doesn't go quiet
  drop_stale: true         # drops a reply if someone else spoke in the meantime
  max_reply_s: 30          # longest reply (also capped by ptt.max_tx_seconds)
  max_replies_per_hour: null   # null = no limit
  min_reply_gap_s: 0
  approve_timeout_s: 60
  level: 0.5               # its voice's peak level (audio.tx_gain applies on top)
  keep_audio: true         # keep each over's audio with the log (about 1.9 MB a minute of talk)
  retention_days: null     # delete logs and audio older than this; null = keep everything
  pronounce: {"RadPi": "Rad Pie"}   # words the voice gets wrong -> how to spell them for it
  stt:                     # speech to text
    backend: faster_whisper   # on the Pi's CPU; or openai (any compatible server: url, api_key), or mock
    model: base.en            # tiny.en is faster, small.en more accurate
    prompt: null              # vocabulary hint: local names, places, callsigns
  speaker:                 # voice recognition
    backend: ecapa            # SpeechBrain ECAPA (good); basic = numpy only, rough, for testing
    match: null               # how similar counts as the same person; null = the backend's default
    new: null                 # below this, a new caller; between new and match it says "not sure"
    merge: null               # anonymous callers whose voices are this alike are merged
                              # See  python -m server.bot people --similar  to tune these.
  llm:
    backend: ollama           # ollama or hailo-ollama (AI HAT+ 2); openai = any compatible server; mock
    url: http://127.0.0.1:11434
    model: qwen2.5:1.5b
    api_key: null
    temperature: 0.9
  tts:                     # its voice
    backend: piper            # offline; or azure, google, elevenlabs (need the internet), or mock
    voice: null               # piper: path to the .onnx (docs/voice/README.md makes an Aussie one)
    # Cloud voices with an Australian accent, until your own Piper voice is trained:
    #   azure:      voice: en-AU-WilliamNeural (or en-AU-NatashaNeural), region: australiaeast, api_key: ...
    #   google:     voice: en-AU-Chirp3-HD-Fenrir (male) or en-AU-Chirp3-HD-Aoede (female): the natural ones;
    #               en-AU-Neural2-B / -C are the older, flatter voices. api_key: ...
    #   elevenlabs: voice: <voice id of an Australian voice from the voice library>, api_key: ...
    api_key: null
    region: null
    speed: 1.0
